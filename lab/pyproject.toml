[project]
name = "rl-lab"
version = "0.1.0"
description = "Small reproducible reinforcement-learning experiments"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "torch>=2.0",
]

[project.scripts]
cartpole = "rl_lab.cartpole:main"
plot-results = "rl_lab.plot_results:main"

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"
