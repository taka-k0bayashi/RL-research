[project]
name = "rl-lab"
version = "0.1.0"
description = "Small reproducible reinforcement-learning experiments"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "gymnasium[classic-control]>=1.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pillow>=10",
    "torch>=2.0",
]

[project.scripts]
cartpole = "rl_lab.cartpole:main"
distill-cartpole = "rl_lab.distill_cartpole:main"
plot-results = "rl_lab.plot_results:main"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"
