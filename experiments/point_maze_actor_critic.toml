algorithm = "actor_critic"
models = ["mlp_64x64"]

[train]
environment = "point_maze"
seeds = [42]
episodes = 30000
gamma = 0.99
gae_lambda = 0.95
learning_rate = 0.0003
entropy_coefficient_start = 0.001
entropy_coefficient_end = 0.0
value_loss_coefficient = 0.5
max_gradient_norm = 1.0
episodes_per_update = 16

[evaluate]
episodes = 50
