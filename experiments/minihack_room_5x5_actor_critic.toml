algorithm = "actor_critic"
models = ["mlp_64x64"]

[train]
environment = "minihack_room_5x5"
seeds = [42]
episodes = 2000
gamma = 0.99
gae_lambda = 0.95
learning_rate = 0.001
entropy_coefficient_start = 0.01
entropy_coefficient_end = 0.001
value_loss_coefficient = 0.5
max_gradient_norm = 1.0
episodes_per_update = 16

[evaluate]
episodes = 100
