algorithm = "actor_critic"
models = ["linear", "mlp_32", "mlp_64x64", "transformer_d32_h4_ff64"]

[train]
environment = "cartpole"
seeds = [42, 43, 44]
episodes = 30000
gamma = 0.999
gae_lambda = 0.95
learning_rate = 0.01
entropy_coefficient_start = 0.01
entropy_coefficient_end = 0.0005
value_loss_coefficient = 0.5
max_gradient_norm = 1.0
episodes_per_update = 8

[evaluate]
episodes = 20
