algorithm = "actor_critic"
models = ["cnn_16x32_fc128"]

[train]
environment = "cartpole_pixels"
seeds = [42]
episodes = 30000
gamma = 0.999
gae_lambda = 0.95
learning_rate = 0.0003
entropy_coefficient_start = 0.01
entropy_coefficient_end = 0.0
value_loss_coefficient = 0.01
max_gradient_norm = 1.0
episodes_per_update = 8

[evaluate]
episodes = 20
